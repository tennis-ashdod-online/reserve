<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>הזמנת מגרש טניס – מרכז קהילתי עם שלום י"א, אשדוד</title>
  <meta name="description" content="הזמנת מגרש טניס אונליין – 40₪ לשעה, 6 מגרשים, 08:00–21:00. אישור מיידי במייל!">
  <link rel="icon" href="https://i.ibb.co/Z61VPjns/image.jpg" type="image/jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root { 
      --primary: #1a5d1a; --light: #f8f9ea; --shadow: 0 8px 25px rgba(0,0,0,0.08);
      --font-size: 1rem;
    }
    body { 
      font-family: 'Rubik', sans-serif; background: var(--light); color: #333; line-height: 1.7; 
      font-size: var(--font-size); transition: all 0.3s ease;
    }
    .main-title { font-size: 2rem; font-weight: 700; color: var(--primary); text-align: center; margin: 2rem 0 1.5rem; }
    .hero-img { 
      max-width: 100%; height: auto; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 2rem; 
      display: block;
    }
    .form-card { border: none; border-radius: 20px; box-shadow: var(--shadow); padding: 1.5rem; background: white; }
    .form-label { font-weight: 500; color: #1a5d1a; }
    .required-star { color: #d32f2f; font-weight: bold; margin-right: 4px; }
    .form-control, .form-select, textarea { border-radius: 12px; border: 1.5px solid #a8d5a8; padding: 0.75rem; font-size: 1rem; }
    .form-control:focus, .form-select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 0.2rem rgba(26, 93, 26, 0.15); }
    .btn-submit, .btn-call { background: var(--primary); border: none; border-radius: 12px; padding: 0.9rem; font-weight: 600; font-size: 1.1rem; }
    .btn-submit:hover, .btn-call:hover { background: #145214; }
    .info-card { border-radius: 12px; margin-top: 1.5rem; padding: 1rem; text-align: center; background: #e8f5e8; border: 2px solid var(--primary); }
    .info-card h5 { color: var(--primary); margin-bottom: 0.75rem; font-weight: 700; }
    .map-link, .terms-link { color: var(--primary); text-decoration: underline; }
    .price-display { font-size: 1.4rem; font-weight: 700; color: #1a5d1a; }
    .map-container { margin-top: 1.5rem; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .map-container iframe { width: 100%; height: 300px; border: 0; }
    .form-check-label a { color: var(--primary); text-decoration: underline; }

    /* ספינר */
    .loader-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.95); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
      flex-direction: column; gap: 1rem;
      transition: opacity 0.5s ease;
    }
    .loader {
      width: 60px; height: 60px; border: 6px solid #f3f3f3;
      border-top: 6px solid var(--primary); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* הצלחה */
    .success-popup {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: white; padding: 2rem 3rem; border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2); z-index: 10000;
      text-align: center; font-weight: 700; font-size: 1.3rem; color: var(--primary);
      border: 3px solid var(--primary); animation: popup 0.5s ease-out;
    }
    @keyframes popup { from { transform: translate(-50%, -60%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }

    /* כפתור חזור למעלה – רק חץ */
    #backToTop {
      position: fixed; right: 20px; bottom: 20px; z-index: 999;
      background: var(--primary); color: white; border: none;
      width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow); transition: all 0.3s ease;
    }
    #backToTop:hover { background: #145214; transform: scale(1.1); }

    /* וואטסאפ */
    .whatsapp-float-left {
      position: fixed; left: 20px; bottom: 25px; z-index: 1000;
      animation: pulse 2s infinite; text-decoration: none !important; outline: none !important;
    }
    .whatsapp-icon {
      font-size: 36px; color: white; background-color: #25D366;
      width: 60px; height: 60px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease; text-decoration: none !important; outline: none !important;
    }
    .whatsapp-icon:hover { transform: scale(1.1); }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .whatsapp-float-left, .whatsapp-float-left * { text-decoration: none !important; outline: none !important; }

    /* תפריט נגישות – יתעדכן דינמית לפי גובה התמונה */
    #accessibilityToggle, #accessibilityMenu {
      position: fixed;
      left: 20px;
      z-index: 9999;
      transition: all 0.3s ease;
    }
    #accessibilityToggle {
      background: var(--primary); color: white; width: 56px; height: 56px;
      border-radius: 50%; border: none; font-size: 1.8rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2); cursor: pointer;
    }
    #accessibilityToggle:hover { transform: scale(1.1); }

    #accessibilityMenu {
      background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 1rem; width: 60px; display: flex; flex-direction: column; gap: 0.8rem;
      opacity: 0; visibility: hidden; transform: translateY(-10px);
      z-index: 9998;
    }
    #accessibilityMenu.open { opacity: 1; visibility: visible; transform: translateY(0); }

    .accessibility-btn {
      background: #f1f1f1; border: none; width: 48px; height: 48px; border-radius: 50%;
      font-size: 1.3rem; color: #333; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; cursor: pointer;
    }
    .accessibility-btn:hover { background: var(--primary); color: white; transform: scale(1.1); }
    .accessibility-btn.active { background: var(--primary); color: white; }

    /* ניגודיות, קישורים, אפור */
    .high-contrast { --light: #000 !important; --primary: #fff !important; background: #000 !important; color: #fff !important; }
    .high-contrast * { color: #fff !important; background: #000 !important; border-color: #fff !important; }
    .high-contrast .form-card, .high-contrast .info-card { background: #111 !important; }
    .highlight-links a { outline: 3px solid yellow !important; background: rgba(255,255,0,0.3) !important; }
    .grayscale { filter: grayscale(100%); }

    @media (max-width: 576px) {
      #accessibilityToggle, #accessibilityMenu { left: 15px; }
      #accessibilityToggle { width: 50px; height: 50px; font-size: 1.5rem; }
      #accessibilityMenu { width: 50px; }
      .accessibility-btn { width: 42px; height: 42px; font-size: 1.1rem; }
      #backToTop { right: 15px; bottom: 15px; width: 48px; height: 48px; font-size: 1.3rem; }
      .whatsapp-float-left { left: 15px; bottom: 20px; }
      .whatsapp-icon { width: 52px; height: 52px; font-size: 32px; }
    }
  </style>
</head>
<body>

  <!-- כפתור חזור למעלה -->
  <button id="backToTop" class="d-none">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- ספינר -->
  <div id="loaderOverlay" class="loader-overlay d-none">
    <div class="loader"></div>
    <p class="text-muted">שולח את ההזמנה...</p>
  </div>

  <!-- הצלחה -->
  <div id="successPopup" class="d-none"></div>

  <!-- וואטסאפ -->
  <a href="https://wa.me/972524864380?text=%D7%94%D7%99%D7%99%2C%20%D7%90%D7%A0%D7%99%20%D7%A6%D7%A8%D7%99%D7%9A%20%D7%A2%D7%96%D7%A8%D7%94%20%D7%91%D7%94%D7%96%D7%9E%D7%A0%D7%AA%20%D7%9E%D7%92%D7%A8%D7%A9%20%D7%98%D7%A0%D7%99%D7%A1" 
     class="whatsapp-float-left" target="_blank" title="צריך עזרה? שלח הודעה בוואטסאפ">
    <i class="fab fa-whatsapp whatsapp-icon"></i>
  </a>

  <!-- תפריט נגישות – יתעדכן לפי גובה התמונה -->
  <button id="accessibilityToggle" title="פתח תפריט נגישות">
    <i class="fas fa-universal-access"></i>
  </button>
  <div id="accessibilityMenu" class="accessibility-menu">
    <button class="accessibility-btn" onclick="increaseFont()" title="הגדל טקסט"><i class="fas fa-plus"></i></button>
    <button class="accessibility-btn" onclick="decreaseFont()" title="הקטן טקסט"><i class="fas fa-minus"></i></button>
    <button class="accessibility-btn" onclick="toggleContrast()" title="ניגודיות גבוהה"><i class="fas fa-adjust"></i></button>
    <button class="accessibility-btn" onclick="toggleLinks()" title="הדגש קישורים"><i class="fas fa-link"></i></button>
    <button class="accessibility-btn" onclick="toggleGrayscale()" title="מצב אפור"><i class="fas fa-eye-slash"></i></button>
    <button id="speakBtn" class="accessibility-btn" onclick="toggleSpeak()" title="הפעל/עצור קריאה">
      <i class="fas fa-volume-up"></i>
    </button>
  </div>

  <div class="container">
    <h1 class="main-title">מרכז קהילתי עם שלום י"א</h1>
    <div class="text-center">
      <img id="heroImage" src="https://i.ibb.co/Z61VPjns/image.jpg" alt="מגרשי טניס" class="hero-img">
    </div>

    <!-- שאר הטופס – זהה -->
    <h2 class="text-center mt-4 mb-4" style="color: var(--primary); font-weight: 600;">הזמנת מגרש טניס</h2>
    <div class="form-card">
      <form id="bookingForm">
        <div class="mb-3">
          <label class="form-label"><span class="required-star">*</span> שם מלא</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><span class="required-star">*</span> טלפון</label>
          <input type="tel" class="form-control" id="phone" required pattern="05[0-9]{8}" placeholder="05XXXXXXXX">
          <small class="text-muted">פורמט: 05XXXXXXXX</small>
        </div>
        <div class="mb-3">
          <label class="form-label"><span class="required-star">*</span> אימייל</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><span class="required-star">*</span> תאריך</label>
          <input type="date" class="form-control" id="date" required>
        </div>
        <div class="mb-3">
          <label class="form-label"><span class="required-star">*</span> שעה</label>
          <select class="form-select" id="time" required></select>
        </div>
        <div class="mb-3">
          <label class="form-label"><span class="required-star">*</span> משך זמן</label>
          <select class="form-select" id="duration" required>
            <option value="1">שעה אחת (40₪)</option>
            <option value="2">שעתיים (80₪)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label"><span class="required-star">*</span> מגרש</label>
          <select class="form-select" id="court" required>
            <option value="">בחר מגרש</option>
            <option>מגרש 1</option><option>מגרש 2</option><option>מגרש 3</option>
            <option>מגרש 4</option><option>מגרש 5</option><option>מגרש 6</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">הערות (לא חובה)</label>
          <textarea class="form-control" id="notes" rows="2" placeholder="למשל: צריך תאורה..."></textarea>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="terms" required>
          <label class="form-check-label" for="terms">
            <span class="required-star">*</span> אני מסכים 
            <a href="#terms" class="terms-link" target="_blank">לתנאי השימוש</a>
          </label>
        </div>
        <div class="text-center mb-3">
          <p class="price-display">סה"כ לתשלום: <span id="totalPrice">40₪</span></p>
        </div>
        <button type="submit" class="btn btn-submit w-100" id="submitBtn">שלח הזמנה</button>
      </form>
    </div>

    <div class="info-card">
      <h5>פרטי המרכז</h5>
      <p><strong>כתובת:</strong> 
        <a href="https://maps.google.com/?q=31.783165,34.631096" target="_blank" class="map-link">
          הרי גולן 5, אשדוד
        </a>
      </p>
      <p><strong>טלפון:</strong> 08-8678400</p>
      <p><strong>שעות:</strong> א'-ה': 08:00–21:00 | ו': 08:00–14:00 | שבת: 08:00–21:00</p>
      <a href="tel:088678400" class="btn btn-call">התקשר</a>
    </div>

    <div class="map-container">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d600!2d34.6309!3d31.7832!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzEuNzgzMTY1LDM0LjYzMTA5Ng!5e0!3m2!1siw!2sil!4v1731780000000!5m2!1siw!2sil" allowfullscreen="" loading="lazy"></iframe>
    </div>
  </div>

  <script>
    (function(){ emailjs.init("z1P-O8ROFHiXihsLH"); })();

    // === מיקום דינמי של תפריט נגישות לפי גובה התמונה ===
    const heroImg = document.getElementById('heroImage');
    const toggleBtn = document.getElementById('accessibilityToggle');
    const menu = document.getElementById('accessibilityMenu');

    function updateAccessibilityPosition() {
      const imgRect = hero TennImg.getBoundingClientRect();
      const imgTop = imgRect.top + window.scrollY;
      const imgHeight = imgRect.height;

      // מיקום הכפתור: מעל התמונה (למעלה שלה)
      toggleBtn.style.top = `${imgTop}px`;

      // מיקום התפריט: מתחת לכפתור, בגובה התמונה
      menu.style.top = `${imgTop + 70}px`; // 70px = גובה כפתור + מרווח
    }

    // עדכון בטעינה + שינוי גודל
    window.addEventListener('load', updateAccessibilityPosition);
    window.addEventListener('resize', updateAccessibilityPosition);
    heroImg.addEventListener('load', updateAccessibilityPosition);

    // פתיחת התפריט
    toggleBtn.addEventListener('click', () => {
      menu.classList.toggle('open');
    });

    // === שאר הקוד (תאריך, שעות, טופס, נגישות, קריאה) ===
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const minDate = `${yyyy}-${mm}-${dd}`;
    const maxDateObj = new Date(); maxDateObj.setDate(today.getDate() + 13);
    const maxDate = `${maxDateObj.getFullYear()}-${String(maxDateObj.getMonth() + 1).padStart(2, '0')}-${String(maxDateObj.getDate()).padStart(2, '0')}`;
    const dateInput = document.getElementById('date');
    dateInput.setAttribute('min', minDate); dateInput.setAttribute('max', maxDate); dateInput.value = minDate;

    const timeSelect = document.getElementById('time');
    const regularHours = ["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"];
    const fridayHours = ["08:00","09:00","10:00","11:00","12:00","13:00","14:00"];
    function updateTimeOptions() {
      const day = new Date(dateInput.value).getDay();
      timeSelect.innerHTML = '<option value="">בחר שעה</option>';
      const hours = (day === 5) ? fridayHours : regularHours;
      hours.forEach(h => {
        const opt = document.createElement('option'); opt.value = h; opt.textContent = h; timeSelect.appendChild(opt);
      });
    }
    dateInput.addEventListener('change', updateTimeOptions); updateTimeOptions();

    const durationSelect = document.getElementById('duration');
    const totalPriceEl = document.getElementById('totalPrice');
    function updatePrice() { totalPriceEl.textContent = durationSelect.value === "1" ? "40₪" : "80₪"; }
    durationSelect.addEventListener('change', updatePrice); updatePrice();

    let bookings = JSON.parse(localStorage.getItem('tennis_bookings') || '[]');

    window.addEventListener('scroll', () => {
      document.getElementById('backToTop').classList.toggle('d-none', window.scrollY < 300);
    });
    document.getElementById('backToTop').addEventListener('click', () => {
      window.scrollTo({top: 0, behavior: 'smooth'});
    });

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true; submitBtn.innerHTML = 'שולח...';

      const data = {
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        date: document.getElementById('date').value,
        time: timeSelect.value,
        duration: durationSelect.value,
        court: document.getElementById('court').value,
        notes: document.getElementById('notes').value.trim() || "אין",
        price: totalPriceEl.textContent
      };

      if (!/^05\d{8}$/.test(data.phone)) {
        alert("הכנס טלפון ישראלי תקין (10 ספרות, מתחיל ב-05)");
        submitBtn.disabled = false; submitBtn.innerHTML = 'שלח הזמנה'; return;
      }
      if (bookings.some(b => b.date === data.date && b.time === data.time && b.court === data.court)) {
        alert("המגרש תפוס. בחר מגרש/שעה אחרים.");
        submitBtn.disabled = false; submitBtn.innerHTML = 'שלח הזמנה'; return;
      }

      const loader = document.getElementById('loaderOverlay');
      loader.classList.remove('d-none');
      setTimeout(() => {
        loader.classList.add('d-none');
        bookings.push(data); localStorage.setItem('tennis_bookings', JSON.stringify(bookings));

        const successPopup = document.getElementById('successPopup');
        successPopup.innerHTML = `<div class="success-popup">
          <h4>ההזמנה בוצעה בהצלחה!</h4>
          <p><strong>${data.name}</strong> – מגרש ${data.court}<br>${data.date} | ${data.time} | ${data.price}</p>
          <p class="text-success">אישור נשלח ל-${data.email}</p>
        </div>`;
        successPopup.classList.remove('d-none');
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#1a5d1a', '#4CAF50', '#8BC34A', '#CDDC39'] });

        emailjs.send("service_ma6h7ym", "template_4eh09k2", { to_email: data.email, customer_name: data.name, date: data.date, time: data.time, court: data.court, duration: data.duration === "1" ? "שעה אחת" : "שעתיים", price: data.price });
        emailjs.send("service_ma6h7ym", "template_admin_full", { to_email: "eitan.morgunov@gmail.com", customer_name: data.name, phone: data.phone, email: data.email, date: data.date, time: data.time, court: data.court, duration: data.duration === "1" ? "שעה אחת" : "שעתיים", price: data.price, notes: data.notes });

        this.reset(); dateInput.value = minDate; durationSelect.value = "1"; updateTimeOptions(); updatePrice();
        setTimeout(() => { successPopup.classList.add('d-none'); submitBtn.disabled = false; submitBtn.innerHTML = 'שלח הזמנה'; }, 4000);
      }, 2000);
    });

    // נגישות
    function increaseFont() { 
      let size = parseFloat(getComputedStyle(document.body).fontSize); 
      document.body.style.fontSize = (size + 1) + 'px'; 
    }
    function decreaseFont() { 
      let size = parseFloat(getComputedStyle(document.body).fontSize); 
      if (size > 12) document.body.style.fontSize = (size - 1) + 'px'; 
    }
    function toggleContrast() { document.body.classList.toggle('high-contrast'); }
    function toggleLinks() { document.body.classList.toggle('highlight-links'); }
    function toggleGrayscale() { document.body.classList.toggle('grayscale'); }

    // קריאה בקול
    let utterance = null;
    const speakBtn = document.getElementById('speakBtn');
    const speakIcon = speakBtn.querySelector('i');
    function toggleSpeak() {
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        speakIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
        speakBtn.classList.remove('active');
      } else {
        const text = document.body.innerText;
        utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'he-IL';
        utterance.rate = 0.9;
        utterance.pitch = 1;
        utterance.onend = () => {
          speakIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
          speakBtn.classList.remove('active');
        };
        speechSynthesis.speak(utterance);
        speakIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
        speakBtn.classList.add('active');
      }
    }
  </script>
</body>
</html>
