<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="הזמנת מגרשי טניס וכדורסל במרכז קהילתי עם שלום, רובע יא' אשדוד. מחיר: 40₪ לשעה. פתוח כל יום 08:00–21:00">
  <title>רובע יא' - מרכז קהילתי עם שלום</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991119.png" type="image/png">
  <style>
    :root {
      --primary: #1a73e8;
      --light: #f8f9fa;
      --dark: #333;
      --success: #e8f5e9;
      --error: #ffebee;
      --red: #e53935;
      --green: #4caf50;
    }
    * {box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{
      background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
                 url('https://images.unsplash.com/photo-1622278494980-874d6f8bf7ed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80')
                 center/cover no-repeat fixed;
      color:#fff;line-height:1.6;min-height:100vh;padding:20px;
    }
    .container{
      max-width:900px;margin:0 auto;background:rgba(255,255,255,.95);color:var(--dark);
      border-radius:15px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.3);backdrop-filter:blur(8px);
      position:relative;text-align:center;
    }
    .lang-switch{
      position:absolute;top:15px;left:50%;transform:translateX(-50%);
      font-size:.85rem;display:flex;gap:8px;z-index:100;
    }
    .lang-btn{
      display:flex;align-items:center;gap:6px;color:#666;text-decoration:none;
      padding:6px 10px;border-radius:6px;transition:all .2s;font-weight:500;
    }
    .lang-btn:hover, .lang-btn.active{
      background:#e3f2fd;color:var(--primary);
    }
    .lang-separator{color:#aaa;font-weight:bold;}
    header{
      text-align:center;margin-top:60px;margin-bottom:25px;
    }
    h1{
      color:var(--primary);margin-bottom:8px;font-size:1.8rem;
    }
    .courts-wrapper {
      max-width:700px;margin:0 auto;
      transition: all 0.4s ease;
    }
    .courts-wrapper.hidden {
      opacity: 0; transform: translateY(20px); height: 0; overflow: hidden; margin: 0; padding: 0;
    }
    #bookingForm {
      display: none; max-width: 700px; margin: 20px auto; padding: 20px;
      background: #f9f9f9; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.15);
      animation: slideDown 0.4s ease-out;
    }
    #bookingForm.visible { display: block; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-btn {
      background: #f44336; color: white; border: none; padding: 10px 16px;
      border-radius: 6px; font-size: 0.9rem; cursor: pointer; margin-bottom: 15px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .back-btn:hover { background: #d32f2f; }
    .back-btn::before { content: "←"; }
    .courts-map{
      display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr auto 1fr;
      gap:15px; padding:20px; background:rgba(0,0,0,.1); border-radius:12px; position:relative; z-index:10;
    }
    .wall-separator {
      grid-row: 3/4; grid-column:1/-1; height:30px;
      background:linear-gradient(135deg,#A0522D 0%,#8B4513 50%,#A0522D 100%);
      border-top:3px solid #D2691E; border-bottom:3px solid #5D2E0D;
      box-shadow:0 8px 15px rgba(0,0,0,0.4),inset 0 2px 4px rgba(255,255,255,0.2);
      border-radius:4px; z-index:10;
    }
    .court-btn { grid-area: auto; padding:20px; background:var(--light); border:2px solid #ddd; border-radius:12px;
      cursor:pointer; text-align:center; font-weight:bold; transition:all .3s; min-height:80px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; z-index:2;
    }
    .court-btn::before { content: "🎾"; font-size: 1.6rem; margin-bottom: 6px; display: block; }
    .court-btn:hover{ border-color:var(--primary); background:#e3f2fd; transform:translateY(-3px); box-shadow:0 6px 15px rgba(0,0,0,.15); }
    .court-btn.selected{ background:var(--primary); color:#fff; border-color:var(--primary); transform:translateY(-5px); box-shadow:0 8px 20px rgba(26,115,232,.3); }
    .court-btn.taken { background:#ffebee; border-color:var(--red); opacity:0.7; }
    .court-btn.taken::after { content: "✖"; position: absolute; top:8px; right:8px; font-weight:bold; color:var(--red); }
    .form-group{margin-bottom:18px;}
    label{display:block;margin-bottom:8px;font-weight:600;text-align:right;}
    select, input[type=text], input[type=email], input[type=tel]{
      width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:1rem;text-align:right;
    }
    select:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .duration-options{display:flex;gap:15px;margin-top:10px;}
    .duration-btn{
      flex:1;padding:12px;text-align:center;border:2px solid #ddd;border-radius:8px;
      cursor:pointer;transition:all .2s;
    }
    .duration-btn.selected{ background:var(--primary); color:#fff; border-color:var(--primary); }
    .submit-btn{
      background:var(--primary);color:#fff;border:none;padding:12px 24px;font-size:1rem;
      border-radius:6px;cursor:pointer;width:100%;margin-top:15px;transition:.2s;
    }
    .submit-btn:hover{background:#0d47a1;}
    .info-box{
      margin-top:30px;padding:15px;background:var(--success);border-radius:8px;
      font-size:.95rem;line-height:1.5;text-align:right;
    }
    .price-note{
      position:absolute;bottom:15px;right:15px;background:#fff3e0;padding:8px 12px;
      border-radius:6px;font-size:.85rem;box-shadow:0 1px 5px rgba(0,0,0,.1);
    }
    .error-msg { color: var(--red); font-size: 0.85rem; margin-top: 5px; text-align: right; display: none; }
    .error-msg.show { display: block; }
    @media (max-width:600px){
      .courts-map{gap:12px;}
      .wall-separator{height:25px;}
      .lang-switch{top:10px;}
      header{margin-top:50px;}
      .price-note{position:static;margin-top:15px;text-align:center;}
      #bookingForm{padding:15px;margin:15px auto;}
      .back-btn{font-size:0.85rem;padding:8px 12px;}
      label, .info-box, select, input[type=text] { text-align: center; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="lang-switch">
    <a href="#" class="lang-btn active" data-lang="he" aria-label="עברית">IL עברית</a>
    <span class="lang-separator">|</span>
    <a href="#" class="lang-btn" data-lang="en" aria-label="English">US English</a>
  </div>
  <header>
    <h1 data-he="רובע יא' - מרכז קהילתי עם שלום" data-en="Am-Shalom Community Center">רובע יא' - מרכז קהילתי עם שלום</h1>
    <p data-he="בחרו את המגרש שבו תרצו לשחק" data-en="Choose the tennis court where you want to play">בחרו את המגרש שבו תרצו לשחק</p>
  </header>
  <div class="courts-wrapper" id="courtsWrapper">
    <div class="courts-map" role="region" aria-labelledby="courtsTitle">
      <h2 id="courtsTitle" class="sr-only">מפת מגרשים</h2>
      <div class="court-btn" data-court="5" aria-label="מגרש 5"><span>מגרש 5</span></div>
      <div class="court-btn" data-court="6" aria-label="מגרש 6"><span>מגרש 6</span></div>
      <div class="court-btn" data-court="4" aria-label="מגרש 4"><span>מגרש 4</span></div>
      <div class="court-btn" data-court="3" aria-label="מגרש 3"><span>מגרש 3</span></div>
      <div class="court-btn" data-court="2" aria-label="מגרש 2"><span>מגרש 2</span></div>
      <div class="court-btn" data-court="1" aria-label="מגרש 1"><span>מגרש 1</span></div>
      <div class="wall-separator" aria-hidden="true"></div>
    </div>
  </div>
  <div id="bookingForm" role="form" aria-labelledby="formTitle">
    <button class="back-btn" id="backBtn" aria-label="חזור לבחירת מגרש">חזור</button>
    <h3 id="formTitle" data-he="פרטי הזמנה" data-en="Booking Details">פרטי הזמנה</h3>
    <div class="form-group">
      <label data-he="מגרש נבחר:" data-en="Selected Court:">מגרש נבחר:</label>
      <input type="text" id="selectedCourt" readonly aria-readonly="true" />
    </div>
    <div class="form-group">
      <label for="daySelect" data-he="בחר תאריך:" data-en="Select Date:">בחר תאריך:</label>
      <select id="daySelect" required aria-describedby="dayError">
        <option value="">-- בחר תאריך --</option>
      </select>
      <div class="error-msg" id="dayError">בחר תאריך</div>
    </div>
    <div class="form-group">
      <label for="timeSelect" data-he="בחר שעה:" data-en="Select Time:">בחר שעה:</label>
      <select id="timeSelect" required aria-describedby="timeError">
        <option value="">-- בחר שעה --</option>
      </select>
      <div class="error-msg" id="timeError">בחר שעה</div>
    </div>
    <div class="form-group">
      <label data-he="משך זמן:" data-en="Duration:">משך זמן:</label>
      <div class="duration-options">
        <div class="duration-btn" data-duration="2" aria-label="שעתיים">שעתיים</div>
        <div class="duration-btn selected" data-duration="1" aria-label="שעה אחת">שעה אחת</div>
      </div>
    </div>
    <div class="form-group">
      <label data-he="סה״כ לתשלום:" data-en="Total Amount:">סה״כ לתשלום:</label>
      <input type="text" id="totalPrice" readonly value="40₪" aria-live="polite" />
    </div>
    <button class="submit-btn" id="confirmBookingBtn">אישור הזמנה</button>
  </div>
  <div class="info-box">
    <p><strong data-he="כתובת:" data-en="Address:">כתובת:</strong> <span data-he="הרי גולן 6, אשדוד, ישראל" data-en="Harei Golan 6, Ashdod, Israel">הרי גולן 6, אשדוד, ישראל</span></p>
    <p><strong data-he="טלפון:" data-en="Phone:">טלפון:</strong> <a href="tel:088678400">08-8678400</a></p>
    <p data-he="שעות פעילות: ראשון-שבת 08:00–21:00" data-en="Hours: Sun-Sat 08:00–21:00">שעות פעילות: ראשון-שבת 08:00–21:00</p>
  </div>
  <div class="price-note">
    <span data-he="תעריף: 40₪ לשעה" data-en="Rate: 40₪ per hour">תעריף: 40₪ לשעה</span>
  </div>
</div>

<script>
  const hours = Array.from({length: 14}, (_, i) => {
    const h = 8 + i;
    return h < 10 ? `0${h}:00` : `${h}:00`;
  }).filter(h => parseInt(h) <= 21);

  function generateNextDates(count = 14) {
    const options = [];
    const today = new Date();
    for (let i = 0; i < count; i++) {
      const date = new Date(today);
      date.setDate(today.getDate() + i);
      const dateStr = date.toISOString().split('T')[0];
      const dayName = date.toLocaleDateString('he-IL', { weekday: 'long' });
      const display = `${dayName} ${date.getDate()}/${date.getMonth()+1}`;
      options.push({ value: dateStr, text: display });
    }
    return options;
  }

  const translations = {
    he: { /* ... same as before ... */ },
    en: { /* ... same as before ... */ }
  };

  // ... same variables ...
  const courtsWrapper = document.getElementById('courtsWrapper');
  const bookingForm = document.getElementById('bookingForm');
  const backBtn = document.getElementById('backBtn');
  const daySelect = document.getElementById('daySelect');
  const timeSelect = document.getElementById('timeSelect');
  let selectedBtn = null;
  let duration = 1;

  function getBookedSlots() {
    return JSON.parse(localStorage.getItem('bookings') || '[]');
  }

  function isSlotTaken(court, date, time, duration = 1) {
    const bookings = getBookedSlots();
    const [hour] = time.split(':').map(Number);
    const endHour = hour + duration;
    return bookings.some(b => {
      if (b.court !== court || b.date !== date) return false;
      const [bHour] = b.time.split(':').map(Number);
      const bEnd = bHour + (b.duration === 'שעתיים' || b.duration === '2 Hours' ? 2 : 1);
      return (hour < bEnd && endHour > bHour);
    });
  }

  function updateTimeOptions() {
    const lang = document.documentElement.lang;
    const t = translations[lang];
    const selectedDate = daySelect.value;
    const court = document.getElementById('selectedCourt').value;

    if (!selectedDate || !court) {
      timeSelect.innerHTML = `<option value="">-- ${lang === 'he' ? 'בחר שעה' : 'Select Time'} --</option>`;
      return;
    }

    timeSelect.innerHTML = `<option value="">-- ${lang === 'he' ? 'בחר שעה' : 'Select Time'} --</option>`;
    hours.forEach(h => {
      const hour = parseInt(h);
      const isTaken = isSlotTaken(court, selectedDate, h, duration);
      const nextHourTaken = duration === 2 && hour < 21 && isSlotTaken(court, selectedDate, `${(hour+1).toString().padStart(2,'0')}:00`, 1);

      const opt = document.createElement('option');
      opt.value = h;
      opt.textContent = h;

      if (isTaken) {
        opt.disabled = true; opt.textContent += ` (${t.courtTaken})`;
        opt.style.color = '#e53935'; opt.style.fontStyle = 'italic';
      } else if (nextHourTaken) {
        opt.disabled = true; opt.textContent += ` (${t.hourAfterTaken})`;
        opt.style.color = '#fb8c00'; opt.style.fontStyle = 'italic';
      }
      timeSelect.appendChild(opt);
    });
  }

  function updateCourtAvailability() {
    const selectedDate = daySelect.value;
    if (!selectedDate) return;
    document.querySelectorAll('.court-btn').forEach(btn => {
      const court = btn.dataset.court;
      const taken = hours.some(h => isSlotTaken(court, selectedDate, h, 1));
      btn.classList.toggle('taken', taken);
      btn.setAttribute('aria-label', taken ? `מגרש ${court} – תפוס` : `מגרש ${court} – זמין`);
    });
  }

  function updateDayOptions(lang) {
    const dates = generateNextDates(14);
    daySelect.innerHTML = `<option value="">-- ${lang === 'he' ? 'בחר תאריך' : 'Select Date'} --</option>`;
    dates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.value;
      opt.textContent = d.text;
      daySelect.appendChild(opt);
    });
  }

  // ... rest of the code (openBooking, goBack, etc.) – same as before, but with date instead of day

  daySelect.addEventListener('change', () => {
    updateTimeOptions();
    updateCourtAvailability();
  });

  // === אתחול ===
  updateDayOptions('he');
  history.replaceState({ page: 'home' }, '', '#home');
</script>
</body>
</html>
