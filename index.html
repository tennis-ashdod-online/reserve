<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="הזמנת מגרשי טניס וכדורסל במרכז קהילתי עם שלום, רובע יא' אשדוד. מחיר: 40₪ לשעה.">
  <title>רובע יא' - מרכז קהילתי עם שלום</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991119.png" type="image/png">
  <style>
    :root {
      --primary: #1a73e8;
      --light: #f8f9fa;
      --dark: #333;
      --success: #e8f5e9;
      --error: #ffebee;
      --red: #e53935;
      --green: #4caf50;
    }
    * {box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif;}
    body{
      background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
                 url('https://images.unsplash.com/photo-1622278494980-874d6f8bf7ed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80')
                 center/cover no-repeat fixed;
      color:#fff;line-height:1.6;min-height:100vh;padding:20px;
    }
    .container{
      max-width:900px;margin:0 auto;background:rgba(255,255,255,.95);color:var(--dark);
      border-radius:15px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.3);backdrop-filter:blur(8px);
      position:relative;text-align:center;
    }
    .lang-switch{
      position:absolute;top:15px;left:50%;transform:translateX(-50%);
      font-size:.85rem;display:flex;gap:8px;z-index:100;
    }
    .lang-btn{
      display:flex;align-items:center;gap:6px;color:#666;text-decoration:none;
      padding:6px 10px;border-radius:6px;transition:all .2s;font-weight:500;
    }
    .lang-btn:hover, .lang-btn.active{
      background:#e3f2fd;color:var(--primary);
    }
    .lang-separator{color:#aaa;font-weight:bold;}
    header{
      text-align:center;margin-top:60px;margin-bottom:25px;
    }
    h1{
      color:var(--primary);margin-bottom:8px;font-size:1.8rem;
    }
    .courts-wrapper {
      max-width:700px;margin:0 auto;
      transition: all 0.4s ease;
    }
    .courts-wrapper.hidden {
      opacity: 0;
      transform: translateY(20px);
      height: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    #bookingForm {
      display: none;
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      animation: slideDown 0.4s ease-out;
    }
    #bookingForm.visible {
      display: block;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { background: #d32f2f; }
    .back-btn::before { content: "Back"; }
    .courts-map{
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:1fr 1fr auto 1fr;
      gap:15px;padding:20px;
      background:rgba(0,0,0,.1);border-radius:12px;position:relative;
      z-index: 10;
    }
    .wall-separator {
      grid-row: 3/4;grid-column:1/-1;height:30px;
      background:linear-gradient(135deg,#A0522D 0%,#8B4513 50%,#A0522D 100%);
      border-top:3px solid #D2691E;border-bottom:3px solid #5D2E0D;
      box-shadow:0 8px 15px rgba(0,0,0,0.4),inset 0 2px 4px rgba(255,255,255,0.2);
      border-radius:4px;z-index:10;
    }
    .court-btn:nth-child(1){grid-area:1/1;}
    .court-btn:nth-child(2){grid-area:1/2;}
    .court-btn:nth-child(3){grid-area:2/1;}
    .court-btn:nth-child(4){grid-area:2/2;}
    .court-btn:nth-child(5){grid-area:4/1;}
    .court-btn:nth-child(6){grid-area:4/2;}
    .court-btn{
      padding:20px;background:var(--light);border:2px solid #ddd;border-radius:12px;
      cursor:pointer;text-align:center;font-weight:bold;transition:all .3s;
      min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;
      position:relative;z-index:2;
    }
    .court-btn::before {
      content: "";
      font-size: 1.6rem;
      margin-bottom: 6px;
      display: block;
      width: 32px;
      height: 32px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%231a73e8"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v2H9v2h2v2h2v-2h2v-2h-2V7z"/></svg>') center/contain no-repeat;
    }
    .court-btn:hover{
      border-color:var(--primary);background:#e3f2fd;transform:translateY(-3px);
      box-shadow:0 6px 15px rgba(0,0,0,.15);
    }
    .court-btn.selected{
      background:var(--primary);color:#fff;border-color:var(--primary);
      transform:translateY(-5px);box-shadow:0 8px 20px rgba(26,115,232,.3);
    }
    .court-btn.taken { background:#ffebee; border-color:var(--red); opacity:0.7; cursor:not-allowed; }
    .court-btn.taken::after { content: "X"; position: absolute; top:8px; right:8px; font-weight:bold; color:var(--red); }

    /* לוח שנה קטן */
    .calendar-container {
      margin: 20px 0;
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
      text-align: center;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .calendar-header button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--primary);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      font-size: 0.9rem;
    }
    .calendar-day {
      padding: 10px 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .2s;
    }
    .calendar-day.header {
      font-weight: bold;
      color: var(--primary);
      cursor: default;
    }
    .calendar-day.today {
      background: #e3f2fd;
      font-weight: bold;
    }
    .calendar-day.selected {
      background: var(--primary);
      color: white;
      font-weight: bold;
    }
    .calendar-day.disabled {
      color: #ccc;
      cursor: not-allowed;
    }
    .calendar-day:hover:not(.disabled):not(.selected) {
      background: #f0f0f0;
    }

    .form-group{margin-bottom:18px;}
    label{display:block;margin-bottom:8px;font-weight:600;text-align:right;}
    select, input[type=text], input[type=tel]{
      width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:1rem;
      text-align:right;
    }
    select:focus-visible, input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .duration-options{display:flex;gap:15px;margin-top:10px;}
    .duration-btn{
      flex:1;padding:12px;text-align:center;border:2px solid #ddd;border-radius:8px;
      cursor:pointer;transition:all .2s;
    }
    .duration-btn.selected{
      background:var(--primary);color:#fff;border-color:var(--primary);
    }
    .submit-btn{
      background:var(--primary);color:#fff;border:none;padding:12px 24px;font-size:1rem;
      border-radius:6px;cursor:pointer;width:100%;margin-top:15px;transition:.2s;
    }
    .submit-btn:hover{background:#0d47a1;}
    .info-box{
      margin-top:30px;padding:15px;background:var(--success);border-radius:8px;
      font-size:.95rem;line-height:1.5;text-align:right;
    }
    .price-note{
      position:absolute;bottom:15px;right:15px;background:#fff3e0;padding:8px 12px;
      border-radius:6px;font-size:.85rem;box-shadow:0 1px 5px rgba(0,0,0,.1);
    }
    .mybookings-link, .admin-link {
      display: block; margin-top: 15px; font-size: 0.9rem;
    }
    .mybookings-link a, .admin-link a {
      color: #1a73e8; font-weight: 600; text-decoration: underline;
    }
    @media (max-width:600px){
      .calendar-grid { gap: 4px; font-size: 0.8rem; }
      .calendar-day { padding: 8px 4px; }
      .courts-map{gap:12px;}
      .wall-separator{height:25px;}
      .lang-switch{top:10px;}
      header{margin-top:50px;}
      .price-note{position:static;margin-top:15px;text-align:center;}
      #bookingForm{padding:15px;margin:15px auto;}
      .back-btn{font-size:0.85rem;padding:8px 12px;}
      label, .info-box, select, input[type=text] { text-align: center; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="lang-switch">
    <a href="#" class="lang-btn active" data-lang="he">IL עברית</a>
    <span class="lang-separator">|</span>
    <a href="#" class="lang-btn" data-lang="en">US English</a>
  </div>
  <header>
    <h1 data-he="רובע יא' - מרכז קהילתי עם שלום" data-en="Am-Shalom Community Center">רובע יא' - מרכז קהילתי עם שלום</h1>
    <p data-he="בחרו את המגרש שבו תרצו לשחק" data-en="Choose the tennis court">בחרו את המגרש שבו תרצו לשחק</p>
  </header>

  <div class="courts-wrapper" id="courtsWrapper">
    <div class="courts-map">
      <div class="court-btn" data-court="5"><span>מגרש 5</span></div>
      <div class="court-btn" data-court="6"><span>מגרש 6</span></div>
      <div class="court-btn" data-court="4"><span>מגרש 4</span></div>
      <div class="court-btn" data-court="3"><span>מגרש 3</span></div>
      <div class="wall-separator"></div>
      <div class="court-btn" data-court="2"><span>מגרש 2</span></div>
      <div class="court-btn" data-court="1"><span>מגרש 1</span></div>
    </div>
  </div>

  <div id="bookingForm">
    <button class="back-btn" id="backBtn">חזור</button>
    <h3 data-he="פרטי הזמנה" data-en="Booking Details">פרטי הזמנה</h3>

    <div class="form-group">
      <label data-he="מגרש נבחר:" data-en="Selected Court:">מגרש נבחר:</label>
      <input type="text" id="selectedCourt" readonly />
    </div>

    <!-- לוח שנה קטן -->
    <div class="calendar-container" id="calendarContainer"></div>

    <div class="form-group">
      <label for="timeSelect" data-he="בחר שעה:" data-en="Select Time:">בחר שעה:</label>
      <select id="timeSelect" required>
        <option value="">-- בחר שעה --</option>
      </select>
    </div>

    <div class="form-group">
      <label data-he="משך זמן:" data-en="Duration:">משך זמן:</label>
      <div class="duration-options">
        <div class="duration-btn" data-duration="2" data-he="שעתיים" data-en="2 Hours">שעתיים</div>
        <div class="duration-btn selected" data-duration="1" data-he="שעה אחת" data-en="1 Hour">שעה אחת</div>
      </div>
    </div>

    <div class="form-group">
      <label data-he="סה״כ לתשלום:" data-en="Total Amount:">סה״כ לתשלום:</label>
      <input type="text" id="totalPrice" readonly value="40₪" />
    </div>

    <button class="submit-btn" id="confirmBookingBtn" data-he="אישור הזמנה" data-en="Confirm Booking">אישור הזמנה</button>
  </div>

  <div class="info-box">
    <p><strong data-he="כתובת:" data-en="Address:">כתובת:</strong> <span data-he="הרי גולן 6, אשדוד" data-en="Harei Golan 6, Ashdod">הרי גולן 6, אשדוד</span></p>
    <p><strong data-he="טלפון:" data-en="Phone:">טלפון:</strong> <a href="tel:088678400">08-8678400</a></p>
    <p data-he="שעות פעילות: ראשון-שבת 08:00–21:00" data-en="Hours: Sun-Sat 08:00–21:00">שעות פעילות: ראשון-שבת 08:00–21:00</p>
    <div class="mybookings-link"><a href="my-bookings.html" data-he="ההזמנות שלי" data-en="My Bookings">ההזמנות שלי</a></div>
    <div class="admin-link"><a href="admin.html" data-he="ניהול הזמנות (למנהל)" data-en="Admin Panel">ניהול הזמנות (למנהל)</a></div>
  </div>

  <div class="price-note">
    <span data-he="תעריף: 40₪ לשעה" data-en="Rate: 40₪ per hour">תעריף: 40₪ לשעה</span>
  </div>
</div>

<!-- WhatsApp – שנה כאן את המספר שלך -->
<div id="whatsappHelp" style="position:fixed; bottom:20px; left:20px; z-index:9999;">
  <a href="https://wa.me/97258678400?text=שלום!%20אני%20צריך%20עזרה%20בהזמנת%20מגרש" 
     target="_blank" 
     style="background:#25D366; color:#fff; width:60px; height:60px; border-radius:50%; 
            display:flex; align-items:center; justify-content:center; font-size:28px; 
            box-shadow:0 4px 15px rgba(0,0,0,.3); text-decoration:none; animation: pulse 2s infinite;">
    ?
  </a>
</div>

<style>
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  #whatsappHelp a:hover { transform: scale(1.15) !important; }
</style>

<script>
  const hours = [];
  for(let h = 8; h <= 21; h++) hours.push(h.toString().padStart(2, '0') + ':00');

  let selectedBtn = null;
  let duration = 1;
  let selectedDate = null;

  const courtsWrapper = document.getElementById('courtsWrapper');
  const bookingForm = document.getElementById('bookingForm');
  const backBtn = document.getElementById('backBtn');
  const timeSelect = document.getElementById('timeSelect');
  const calendarContainer = document.getElementById('calendarContainer');

  const translations = {
    he: {
      back: "חזור",
      months: ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"],
      days: ["א'","ב'","ג'","ד'","ה'","ו'","ש'"],
      courtTaken: "תפוס",
      nextHourTaken: "שעה הבאה תפוסה",
      selectDate: "-- בחר תאריך קודם --",
      selectTime: "-- בחר שעה --",
      missing: "אנא בחר תאריך ושעה",
      courtTakenAlert: "המגרש תפוס בשעה זו!"
    },
    en: {
      back: "Back",
      months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
      days: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
      courtTaken: "Taken",
      nextHourTaken: "Next hour taken",
      selectDate: "-- Select date first --",
      selectTime: "-- Select time --",
      missing: "Please select date and time",
      courtTakenAlert: "This court is already booked!"
    }
  };

  function renderCalendar(date) {
    const lang = document.documentElement.lang;
    const t = translations[lang];
    const year = date.getFullYear();
    const month = date.getMonth();
    const today = new Date();
    today.setHours(0,0,0,0);

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = `
      <div class="calendar-header">
        <button id="prevMonth">Previous</button>
        <span>${t.months[month]} ${year}</span>
        <button id="nextMonth">Next</button>
      </div>
      <div class="calendar-grid">
    `;

    t.days.forEach(d => html += `<div class="calendar-day header">${d}</div>`);

    for (let i = 0; i < firstDay; i++) {
      html += `<div class="calendar-day disabled"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const currentDate = new Date(year, month, day);
      currentDate.setHours(0,0,0,0);
      const isToday = currentDate.getTime() === today.getTime();
      const isSelected = selectedDate && selectedDate.getTime() === currentDate.getTime();
      const isPast = currentDate < today;

      const dateStr = `${year}-${(month+1).toString().padStart(2,'0')}-${day.toString().padStart(2,'0')}`;
      html += `
        <div class="calendar-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${isPast ? 'disabled' : ''}"
             data-date="${dateStr}">
          ${day}
        </div>
      `;
    }

    html += `</div>`;
    calendarContainer.innerHTML = html;

    document.getElementById('prevMonth').onclick = () => renderCalendar(new Date(year, month - 1));
    document.getElementById('nextMonth').onclick = () => renderCalendar(new Date(year, month + 1));

    document.querySelectorAll('.calendar-day:not(.disabled):not(.header)').forEach(day => {
      day.onclick = () => {
        selectedDate = new Date(day.dataset.date);
        renderCalendar(selectedDate);
        updateTimeOptions();
      };
    });
  }

  function getBookedSlots() {
    return JSON.parse(localStorage.getItem('bookings') || '[]');
  }

  function isSlotTaken(court, date, time, duration = 1) {
    const bookings = getBookedSlots();
    const [hour] = time.split(':').map(Number);
    const endHour = hour + duration;

    return bookings.some(b => {
      if (b.court !== court || b.date !== date) return false;
      const [bHour] = b.time.split(':').map(Number);
      const bEnd = bHour + (b.duration === 'שעתיים' || b.duration === '2 Hours' ? 2 : 1);
      return (hour < bEnd && endHour > bHour);
    });
  }

  function updateTimeOptions() {
    const lang = document.documentElement.lang;
    const t = translations[lang];

    if (!selectedDate) {
      timeSelect.innerHTML = `<option value="">${t.selectDate}</option>`;
      return;
    }

    const dateStr = selectedDate.toISOString().split('T')[0];
    const court = document.getElementById('selectedCourt').value;

    timeSelect.innerHTML = `<option value="">${t.selectTime}</option>`;

    hours.forEach(h => {
      const hour = parseInt(h);
      const isTaken = isSlotTaken(court, dateStr, h, duration);
      const nextHourTaken = duration === 2 && hour < 21 && isSlotTaken(court, dateStr, `${(hour+1).toString().padStart(2,'0')}:00`, 1);

      const opt = document.createElement('option');
      opt.value = h;
      opt.textContent = h;

      if (isTaken) {
        opt.disabled = true;
        opt.textContent += ` (${t.courtTaken})`;
      } else if (nextHourTaken) {
        opt.disabled = true;
        opt.textContent += ` (${t.nextHourTaken})`;
      }

      timeSelect.appendChild(opt);
    });
  }

  function openBooking(btn) {
    if (selectedBtn) selectedBtn.classList.remove('selected');
    btn.classList.add('selected');
    selectedBtn = btn;
    document.getElementById('selectedCourt').value = btn.querySelector('span').textContent;
    bookingForm.classList.add('visible');
    courtsWrapper.classList.add('hidden');
    selectedDate = null;
    renderCalendar(new Date());
    updateTimeOptions();
    updateFormLanguage();
  }

  function goBack() {
    if (selectedBtn) selectedBtn.classList.remove('selected');
    selectedBtn = null;
    bookingForm.classList.remove('visible');
    courtsWrapper.classList.remove('hidden');
    history.pushState({ page: 'home' }, '', '#home');
  }

  function updateFormLanguage() {
    const lang = document.documentElement.lang;
    const t = translations[lang];
    backBtn.textContent = t.back;
    document.querySelectorAll('[data-he]').forEach(el => {
      el.textContent = lang === 'en' ? el.dataset.en : el.dataset.he;
    });
    document.querySelectorAll('.duration-btn').forEach(btn => {
      btn.textContent = lang === 'en' ? btn.dataset.en : btn.dataset.he;
    });
    document.getElementById('confirmBookingBtn').textContent = lang === 'en' ? btn.dataset.en : btn.dataset.he;
  }

  document.querySelectorAll('.court-btn').forEach(btn => btn.addEventListener('click', () => openBooking(btn)));
  backBtn.addEventListener('click', goBack);

  document.querySelectorAll('.duration-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      duration = +btn.dataset.duration;
      document.getElementById('totalPrice').value = (40 * duration) + '₪';
      updateTimeOptions();
    });
  });

  document.getElementById('confirmBookingBtn').addEventListener('click', () => {
    const lang = document.documentElement.lang;
    const t = translations[lang];
    const date = selectedDate ? selectedDate.toISOString().split('T')[0] : '';
    const time = timeSelect.value;
    const court = document.getElementById('selectedCourt').value;

    if (!date || !time || !court) {
      alert(t.missing);
      return;
    }

    if (isSlotTaken(court, date, time, duration)) {
      alert(t.courtTakenAlert);
      return;
    }

    const params = new URLSearchParams({
      court, date, time, duration,
      total: (40 * duration) + '₪'
    });

    window.location.href = `booking-details.html?${params.toString()}`;
  });

  // שינוי שפה
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      const lang = btn.dataset.lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';

      // עדכון טקסטים
      document.querySelector('h1').textContent = lang === 'en' ? document.querySelector('h1').dataset.en : document.querySelector('h1').dataset.he;
      document.querySelector('header p').textContent = lang === 'en' ? document.querySelector('header p').dataset.en : document.querySelector('header p').dataset.he;
      document.querySelectorAll('[data-he]').forEach(el => {
        el.textContent = lang === 'en' ? el.dataset.en : el.dataset.he;
      });

      if (bookingForm.classList.contains('visible')) {
        updateFormLanguage();
        renderCalendar(selectedDate || new Date());
        updateTimeOptions();
      }
    });
  });

  history.replaceState({ page: 'home' }, '', '#home');
</script>
</body>
</html>
