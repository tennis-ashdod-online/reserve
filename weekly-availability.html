<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>זמינות שבועית - מרכז קהילתי עם שלום</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991119.png" type="image/png">
  <style>
    :root {
      --primary: #1a73e8;
      --light: #f8f9fa;
      --dark: #333;
      --success: #e8f5e9;
      --error: #ffebee;
      --red: #e53935;
      --green: #4caf50;
      --gray: #9e9e9e;
      --available: #c8e6c9;
      --booked: #ffcdd2;
      --partial: #fff3e0;
    }
    * {box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
    body{
      background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
                 url('https://images.unsplash.com/photo-1622278494980-874d6f8bf7ed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80')
                 center/cover no-repeat fixed;
      color:#fff;line-height:1.6;min-height:100vh;padding:20px;
    }
    .container{
      max-width:1100px;margin:40px auto;background:rgba(255,255,255,.97);color:var(--dark);
      border-radius:15px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,.3);
      overflow-x:auto;
    }
    h1{
      text-align:center;color:var(--primary);margin-bottom:20px;font-size:1.8rem;
    }
    .legend{
      display:flex;justify-content:center;gap:20px;margin-bottom:15px;flex-wrap:wrap;
      font-size:0.9rem;
    }
    .legend-item{
      display:flex;align-items:center;gap:6px;
    }
    .legend-color{
      width:16px;height:16px;border-radius:4px;
    }
    table{
      width:100%;min-width:900px;border-collapse:collapse;
      background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.1);
    }
    th{
      background:var(--primary);color:#fff;padding:12px 8px;text-align:center;
      font-weight:600;position:sticky;top:0;z-index:10;
    }
    th.hour{
      background:#fff;color:var(--dark);font-weight:normal;border-bottom:2px solid #ddd;
      position:sticky;left:0;z-index:11;
    }
    td{
      padding:8px;text-align:center;border:1px solid #eee;
      cursor:pointer;transition:all .2s;font-size:0.85rem;
    }
    td.hour{
      background:#f5f5f5;font-weight:600;color:var(--dark);
      position:sticky;left:0;z-index:9;
    }
    .available{
      background:var(--available);color:var(--green);
    }
    .available:hover{
      background:#a5d6a7;transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.2);
    }
    .booked{
      background:var(--booked);color:var(--red);cursor:not-allowed;
    }
    .partial{
      background:var(--partial);color:#ef6c00;
    }
    .partial:hover{
      background:#ffcc80;
    }
    .court-name{
      writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
      font-weight:bold;color:var(--primary);
    }
    .back-link{
      display:block;text-align:center;margin-top:25px;color:var(--primary);
      text-decoration:none;font-weight:600;
    }
    .back-link:hover{text-decoration:underline;}
    .loading{
      text-align:center;padding:40px;color:#666;font-size:1.1rem;
    }
    @media (max-width:768px){
      th, td{font-size:0.75rem;padding:6px;}
      .legend{flex-direction:column;align-items:center;}
      .court-name{font-size:0.7rem;}
    }
  </style>
</head>
<body>
<div class="container">
  <h1>זמינות מגרשים – 7 ימים קדימה</h1>
  
  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background:var(--available);"></div>
      <span>פנוי</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:var(--booked);"></div>
      <span>תפוס</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background:var(--partial);"></div>
      <span>חלקי (שעה אחת בלבד)</span>
    </div>
  </div>

  <div id="availabilityTable" class="loading">טוען זמינות...</div>

  <a href="index.html" class="back-link">חזרה לבחירת מגרש</a>
</div>

<script>
  const HOURS = Array.from({length: 14}, (_, i) => {
    const h = 8 + i;
    return h.toString().padStart(2, '0') + ':00';
  });

  const COURTS = ['מגרש 1', 'מגרש 2', 'מגרש 3', 'מגרש 4', 'מגרש 5', 'מגרש 6'];

  function generateNext7Days() {
    const days = [];
    const today = new Date('2025-11-15');
    const heWeekdays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
    for (let i = 0; i < 7; i++) {
      const date = new Date(today);
      date.setDate(today.getDate() + i);
      const dateStr = date.toISOString().split('T')[0];
      const dayName = heWeekdays[date.getDay()];
      const display = `${dayName}<br>${date.getDate()}/${date.getMonth()+1}`;
      days.push({ value: dateStr, display });
    }
    return days;
  }

  function getBookedSlots() {
    return JSON.parse(localStorage.getItem('bookings') || '[]');
  }

  function isSlotTaken(court, date, time, duration = 1) {
    const bookings = getBookedSlots();
    const [hour] = time.split(':').map(Number);
    const endHour = hour + duration;

    return bookings.some(b => {
      if (b.court !== court || b.date !== date) return false;
      const [bHour] = b.time.split(':').map(Number);
      const bEnd = bHour + (b.duration.includes('שעתיים') || b.duration.includes('2 Hours') ? 2 : 1);
      return (hour < bEnd && endHour > bHour);
    });
  }

  function buildTable() {
    const days = generateNext7Days();
    const table = document.getElementById('availabilityTable');
    
    let html = `
      <table>
        <thead>
          <tr>
            <th class="hour">שעה</th>
    `;

    days.forEach(day => {
      html += `<th colspan="6">${day.display}</th>`;
    });

    html += `</tr><tr><th class="hour"></th>`;

    for (let i = 0; i < 7; i++) {
      COURTS.forEach(court => {
        html += `<th class="court-name">${court}</th>`;
      });
    }

    html += `</tr></thead><tbody>`;

    HOURS.forEach(hour => {
      html += `<tr><td class="hour">${hour}</td>`;
      
      days.forEach(day => {
        COURTS.forEach(court => {
          const isTaken = isSlotTaken(court, day.value, hour, 1);
          const nextTaken = hour < '21:00' && isSlotTaken(court, day.value, `${(parseInt(hour)+1).toString().padStart(2,'0')}:00`, 1);
          const canBookTwo = !isTaken && hour < '21:00' && !nextTaken;

          let cellClass = '';
          let title = '';
          if (isTaken) {
            cellClass = 'booked';
            title = 'תפוס';
          } else if (canBookTwo) {
            cellClass = 'available';
            title = 'פנוי (אפשר שעתיים)';
          } else if (!isTaken && !nextTaken) {
            cellClass = 'available';
            title = 'פנוי (שעה אחת)';
          } else {
            cellClass = 'partial';
            title = 'רק שעה אחת פנויה';
          }

          html += `
            <td class="${cellClass}" 
                onclick="bookSlot('${court}', '${day.value}', '${hour}')"
                title="${title}">
              ${isTaken ? '✖' : (canBookTwo ? '✓✓' : '✓')}
            </td>
          `;
        });
      });
      
      html += `</tr>`;
    });

    html += `</tbody></table>`;
    table.innerHTML = html;
  }

  window.bookSlot = (court, date, time) => {
    if (isSlotTaken(court, date, time, 1)) return;

    const duration = (time < '21:00' && !isSlotTaken(court, date, `${(parseInt(time)+1).toString().padStart(2,'0')}:00`, 1)) ? 2 : 1;

    const params = new URLSearchParams({
      court: court,
      date: date,
      time: time,
      duration: duration,
      total: (40 * duration) + '₪',
      lang: 'he'
    });

    window.location.href = `booking-details.html?${params.toString()}`;
  };

  window.addEventListener('load', () => {
    setTimeout(buildTable, 100);
  });

  setInterval(buildTable, 30000);
</script>
</body>
</html>
