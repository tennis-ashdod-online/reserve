<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ההזמנות שלי - מרכז קהילתי עם שלום</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991119.png" type="image/png">
  <style>
    :root {
      --primary: #1a73e8;
      --light: #f8f9fa;
      --dark: #333;
      --success: #e8f5e9;
      --error: #ffebee;
      --red: #e53935;
    }
    * {box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif;}
    body{
      background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
                 url('https://images.unsplash.com/photo-1622278494980-874d6f8bf7ed?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80')
                 center/cover no-repeat fixed;
      color:#fff;line-height:1.6;min-height:100vh;padding:20px;
    }
    .container{
      max-width:800px;margin:40px auto;background:rgba(255,255,255,.97);color:var(--dark);
      border-radius:15px;padding:30px;box-shadow:0 10px 40px rgba(0,0,0,.3);
      text-align:center;
    }
    h1{
      color:var(--primary);margin-bottom:20px;font-size:1.8rem;
    }
    .search-box{
      margin-bottom:30px;padding:20px;background:#f0f8ff;border-radius:12px;
      border-left:5px solid var(--primary);
    }
    label{
      display:block;margin-bottom:10px;font-weight:600;font-size:1.1rem;
    }
    input[type=tel]{
      width:100%;max-width:300px;padding:12px;border:1px solid #ccc;border-radius:6px;
      font-size:1rem;text-align:center;margin:0 auto;display:block;
    }
    input:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .search-btn{
      background:var(--primary);color:#fff;border:none;padding:12px 24px;
      border-radius:6px;cursor:pointer;margin-top:15px;font-size:1rem;transition:.2s;
    }
    .search-btn:hover{background:#0d47a1;}
    .bookings-table{
      width:100%;border-collapse:collapse;margin-top:20px;
      background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1);
    }
    .bookings-table th{
      background:var(--primary);color:#fff;padding:15px;text-align:center;
    }
    .bookings-table td{
      padding:12px;text-align:center;border-bottom:1px solid #eee;
    }
    .bookings-table tr:hover{
      background:#f5f5f5;
    }
    .cancel-btn{
      background:#f44336;color:#fff;border:none;padding:8px 16px;
      border-radius:6px;cursor:pointer;font-size:0.9rem;transition:.2s;
    }
    .cancel-btn:hover{background:#d32f2f;}
    .cancel-btn:disabled{
      background:#ccc;cursor:not-allowed;
    }
    .no-bookings{
      padding:30px;color:#666;font-size:1.1rem;
    }
    .back-link{
      display:inline-block;margin-top:25px;color:var(--primary);text-decoration:none;
      font-weight:600;font-size:1rem;
    }
    .back-link:hover{text-decoration:underline;}
  </style>
</head>
<body>
<div class="container">
  <h1>ההזמנות שלי</h1>
  
  <div class="search-box">
    <label for="phoneSearch">הזן מספר טלפון לחיפוש הזמנות:</label>
    <input type="tel" id="phoneSearch" placeholder="0501234567" inputmode="numeric" pattern="05[0-9]{8}" />
    <button class="search-btn" id="searchBtn">חפש הזמנות</button>
  </div>

  <div id="results">
    <p class="no-bookings">הזן מספר טלפון כדי לראות את ההזמנות שלך</p>
  </div>

  <a href="index.html" class="back-link">חזרה לבחירת מגרש</a>
</div>

<script>
  const searchBtn = document.getElementById('searchBtn');
  const phoneInput = document.getElementById('phoneSearch');
  const resultsDiv = document.getElementById('results');

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' });
  }

  function canCancel(bookingDate, time) {
    const [hour] = time.split(':').map(Number);
    const bookingTime = new Date(bookingDate);
    bookingTime.setHours(hour, 0, 0, 0);
    return Date.now() < bookingTime.getTime();
  }

  function cancelBooking(index) {
    if (!confirm('בטוח שברצונך לבטל את ההזמנה?')) return;
    const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
    bookings.splice(index, 1);
    localStorage.setItem('bookings', JSON.stringify(bookings));
    searchBookings();
  }

  function searchBookings() {
    const phone = phoneInput.value.trim().replace(/\D/g, '');
    if (!/^05[0-9]{8}$/.test(phone)) {
      resultsDiv.innerHTML = `<p style="color:var(--red)">הזן מספר טלפון תקין (05XXXXXXXX)</p>`;
      return;
    }

    const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
    const userBookings = bookings.filter(b => b.phone === phone);

    if (userBookings.length === 0) {
      resultsDiv.innerHTML = `<p class="no-bookings">לא נמצאו הזמנות עבור מספר זה</p>`;
      return;
    }

    let table = `
      <table class="bookings-table">
        <thead>
          <tr>
            <th>מגרש</th>
            <th>תאריך</th>
            <th>שעה</th>
            <th>משך</th>
            <th>סה״כ</th>
            <th>הוזמן ב</th>
            <th>פעולה</th>
          </tr>
        </thead>
        <tbody>
    `;

    userBookings.forEach((b, i) => {
      const globalIndex = bookings.indexOf(b);
      const canCancelNow = canCancel(b.date, b.time);
      const timeEnd = b.duration.includes('שעתיים') || b.duration.includes('2 Hours') 
        ? `${parseInt(b.time)+2}:00` : `${parseInt(b.time)+1}:00`;

      table += `
        <tr>
          <td><strong>${b.court}</strong></td>
          <td>${formatDate(b.date)}</td>
          <td>${b.time}–${timeEnd}</td>
          <td>${b.duration}</td>
          <td>${b.total}</td>
          <td>${new Date(b.created).toLocaleString('he-IL')}</td>
          <td>
            <button class="cancel-btn" ${!canCancelNow ? 'disabled' : ''} 
                    onclick="cancelBooking(${globalIndex})">
              ${canCancelNow ? 'בטל' : 'עבר'}
            </button>
          </td>
        </tr>
      `;
    });

    table += `</tbody></table>`;
    resultsDiv.innerHTML = table;
  }

  searchBtn.addEventListener('click', searchBookings);
  phoneInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchBookings();
  });

  window.addEventListener('load', () => {
    const saved = sessionStorage.getItem('last_phone');
    if (saved) {
      phoneInput.value = saved;
      searchBookings();
    }
  });

  searchBtn.addEventListener('click', () => {
    sessionStorage.setItem('last_phone', phoneInput.value.trim());
  });
</script>
</body>
</html>
