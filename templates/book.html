<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזמנת {{ court.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn { background: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 1.1em; }
        .btn:hover { background: #219653; }
        .back { display: block; text-align: center; margin-top: 20px; color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <h1>הזמנת {{ court.name }}</h1>
        <p style="text-align:center;">₪{{ court.price_per_hour }} לשעה</p>

        <form method="POST">
            <div class="form-group">
                <label>שם מלא</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>טלפון</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
                <label>תאריך</label>
                <input type="date" name="date" required min="{{ 'today' | strftime('%Y-%m-%d') }}">
            </div>
            <div class="form-group">
                <label>שעה</label>
                <input type="time" name="time" required>
            </div>
            <div class="form-group">
                <label>משך זמן (שעות)</label>
                <select name="duration" required>
                    <option value="1">1 שעה</option>
                    <option value="2">2 שעות</option>
                    <option value="3">3 שעות</option>
                </select>
            </div>
            <button type="submit" class="btn">אישור הזמנה</button>
        </form>


        <a href="{{ url_for('index') }}" class="back">חזרה לרשימת המגרשים</a>
    </div>
</body>
</html>
